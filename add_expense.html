<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Personal Expense Analyzer</title>

    <style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #0f172a
    );

    color: #f8fafc;

    min-height: 100vh;
}


/* NAVBAR */

.navbar {
    background: rgba(15, 23, 42, 0.95);

    border-bottom: 1px solid rgba(255,255,255,0.08);

    padding: 18px 35px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    flex-wrap: wrap;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
}

.nav-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.nav-links a {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #60a5fa;
}


/* MAIN */

.page {
    width: 100%;
    max-width: 650px;
    margin: auto;

    padding: 45px 20px 60px;
}


/* BACK */

.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #cbd5e1;

    text-decoration: none;

    font-size: 15px;

    margin-bottom: 25px;
}

.back:hover {
    color: #60a5fa;
}

.back-arrow {
    font-size: 25px;
}


/* TITLE */

.page-title {
    font-size: 31px;
    font-weight: 600;

    color: #ffffff;

    margin-bottom: 8px;
}

.page-subtitle {
    color: #94a3b8;

    font-size: 14px;

    margin-bottom: 28px;
}


/* EXPENSE CARD */

.expense-card {
    background: rgba(30, 41, 59, 0.75);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 16px;

    padding: 30px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.28);
}


/* CARD TITLE */

.card-title {
    font-size: 21px;

    color: #ffffff;

    margin-bottom: 28px;
}


/* AMOUNT */

.amount-section {
    text-align: center;

    margin-bottom: 30px;
}

.amount-label {
    color: #94a3b8;

    font-size: 14px;

    margin-bottom: 8px;
}

.amount-input {
    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: #ffffff;

    text-align: center;

    font-size: 52px;

    padding: 5px;
}

.amount-input::placeholder {
    color: #cbd5e1;
}

.amount-input::-webkit-inner-spin-button,
.amount-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}


/* LABEL */

.field-label {
    display: block;

    color: #cbd5e1;

    font-size: 14px;

    margin-bottom: 10px;
}


/* CATEGORY */

.category-section {
    margin-bottom: 24px;
}

.category-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 10px;
}

.category-option {
    position: relative;
}

.category-option input {
    position: absolute;

    opacity: 0;
}

.category-label {
    min-height: 85px;

    background: rgba(15, 23, 42, 0.75);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 12px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 8px;

    cursor: pointer;

    color: #cbd5e1;

    font-size: 13px;

    transition: 0.2s;
}

.category-icon {
    font-size: 21px;
}

.category-label:hover {
    border-color: rgba(96,165,250,0.4);
}

.category-option input:checked + .category-label {
    background: rgba(37,99,235,0.18);

    border: 1px solid #3b82f6;

    color: #ffffff;

    box-shadow:
        0 0 0 1px rgba(59,130,246,0.15);
}


/* DATE + PAYMENT */

.two-fields {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 14px;
}

.field-box {
    background: rgba(15,23,42,0.75);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 12px;

    padding: 14px;
}

.field-box label {
    display: block;

    color: #94a3b8;

    font-size: 12px;

    margin-bottom: 7px;
}

.field-box input,
.field-box select {
    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: #ffffff;

    font-size: 14px;
}

.field-box select option {
    background: #1e293b;

    color: #ffffff;
}

input[type="date"] {
    color-scheme: dark;
}


/* NOTE */

.note-box {
    background: rgba(15,23,42,0.75);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 12px;

    padding: 14px;

    margin-bottom: 24px;
}

.note-box label {
    display: block;

    color: #94a3b8;

    font-size: 12px;

    margin-bottom: 7px;
}

.note-box textarea {
    width: 100%;

    min-height: 55px;

    resize: none;

    border: none;

    outline: none;

    background: transparent;

    color: #ffffff;

    font-size: 14px;

    font-family: Arial, sans-serif;
}

.note-box textarea::placeholder {
    color: #64748b;
}


/* SAVE BUTTON */

.save-btn {
    width: 100%;

    border: none;

    border-radius: 8px;

    padding: 13px;

    background: #2563eb;

    color: #ffffff;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.3s;
}

.save-btn:hover {
    background: #1d4ed8;

    transform: translateY(-2px);
}


/* MOBILE */

@media (max-width: 600px) {

    .navbar {
        padding: 18px;
    }

    .nav-links {
        margin-top: 12px;

        gap: 12px;
    }

    .page {
        padding: 30px 15px 45px;
    }

    .page-title {
        font-size: 27px;
    }

    .expense-card {
        padding: 22px;

        border-radius: 16px;
    }

    .amount-input {
        font-size: 45px;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .two-fields {
        grid-template-columns: 1fr;
    }

}

</style>


</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        Personal Expense Analyzer
    </div>

    <div class="nav-links">

        <a href="/dashboard">Dashboard</a>

        <a href="/expenses">History</a>

        <a href="/budget">Budget</a>

        <a href="/analytics">Analytics</a>

        <a href="/logout">Logout</a>

    </div>

</div>


<!-- PAGE -->

<div class="page">


    <a href="/dashboard" class="back">

        <span class="back-arrow">←</span>

        <span>Add Expense</span>

    </a>


    <h1 class="page-title">
        Add a new expense
    </h1>

    <p class="page-subtitle">
        Quickly record your spending and keep track of your money.
    </p>


    <!-- EXPENSE CARD -->

    <div class="expense-card">


        <div class="card-title">
            Add expense
        </div>


        <form method="POST">


            <!-- AMOUNT -->

            <div class="amount-section">

                <div class="amount-label">
                    Amount
                </div>

                <input
                    class="amount-input"
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0"
                    placeholder="₹0.00"
                    required
                    autofocus
                >

            </div>


            <!-- CATEGORY -->

            <div class="category-section">

                <label class="field-label">
                    Category
                </label>


                <div class="category-grid">


                    <div class="category-option">

                        <input
                            type="radio"
                            id="food"
                            name="category"
                            value="Food"
                            required
                        >

                        <label
                            for="food"
                            class="category-label"
                        >

                            <span class="category-icon">
                                🍴
                            </span>

                            <span>
                                Food
                            </span>

                        </label>

                    </div>


                    <div class="category-option">

                        <input
                            type="radio"
                            id="travel"
                            name="category"
                            value="Travel"
                        >

                        <label
                            for="travel"
                            class="category-label"
                        >

                            <span class="category-icon">
                                🚌
                            </span>

                            <span>
                                Travel
                            </span>

                        </label>

                    </div>


                    <div class="category-option">

                        <input
                            type="radio"
                            id="bills"
                            name="category"
                            value="Bills"
                        >

                        <label
                            for="bills"
                            class="category-label"
                        >

                            <span class="category-icon">
                                💡
                            </span>

                            <span>
                                Bills
                            </span>

                        </label>

                    </div>


                    <div class="category-option">

                        <input
                            type="radio"
                            id="shopping"
                            name="category"
                            value="Shopping"
                        >

                        <label
                            for="shopping"
                            class="category-label"
                        >

                            <span class="category-icon">
                                🛍️
                            </span>

                            <span>
                                Shopping
                            </span>

                        </label>

                    </div>


                </div>

            </div>


            <!-- DATE + PAYMENT -->

            <div class="two-fields">


                <div class="field-box">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        name="expense_date"
                        required
                    >

                </div>


                <div class="field-box">

                    <label>
                        Paid with
                    </label>

                    <select
                        name="payment_method"
                        required
                    >

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="Net Banking">
                            Net Banking
                        </option>

                    </select>

                </div>


            </div>


            <!-- NOTE -->

            <div class="note-box">

                <label>
                    Note
                </label>

                <textarea
                    name="description"
                    placeholder="Add a note..."
                ></textarea>

            </div>


            <!-- SAVE -->

            <button
                type="submit"
                class="save-btn"
            >
                Save Expense
            </button>


        </form>


    </div>


</div>


<script>

    // Automatically select today's date

    const dateInput =
        document.querySelector('input[name="expense_date"]');

    if (dateInput && !dateInput.value) {

        const today = new Date();

        const year = today.getFullYear();

        const month =
            String(today.getMonth() + 1).padStart(2, '0');

        const day =
            String(today.getDate()).padStart(2, '0');

        dateInput.value =
            `${year}-${month}-${day}`;
    }

</script>


</body>

</html>
