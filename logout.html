<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout - Personal Expense Analyzer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #0f172a
            );

            color: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .logout-container {
            width: 100%;
            max-width: 500px;

            text-align: center;
        }


        /* LOGO */

        .logo {
            font-size: 22px;
            font-weight: bold;

            color: white;

            margin-bottom: 45px;
        }


        /* CARD */

        .logout-card {
            background: rgba(30, 41, 59, 0.78);

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 22px;

            padding: 45px 35px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

            backdrop-filter: blur(12px);
        }


        /* ICON */

        .logout-icon {
            width: 82px;
            height: 82px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: rgba(37, 99, 235, 0.25);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            border: 1px solid rgba(96,165,250,0.25);
        }


        /* TITLE */

        h1 {
            margin: 0 0 15px;

            font-size: 30px;

            color: white;
        }


        .message {
            color: #cbd5e1;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* BUTTONS */

        .logout-btn,
        .stay-btn {

            width: 100%;

            padding: 15px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            text-decoration: none;

            display: block;
        }


        .logout-btn {

            background: #2563eb;

            color: white;

            border: none;

            margin-bottom: 14px;
        }


        .logout-btn:hover {

            background: #1d4ed8;

            transform: translateY(-2px);
        }


        .stay-btn {

            background: transparent;

            color: #cbd5e1;

            border: 1px solid rgba(255,255,255,0.15);
        }


        .stay-btn:hover {

            background: rgba(255,255,255,0.06);

            color: white;
        }


        .account {

            margin-top: 25px;

            color: #64748b;

            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .logout-container {
                max-width: 100%;
            }

            .logout-card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }

        }

    </style>

</head>

<body>


<div class="logout-container">


    <div class="logo">
        Personal Expense Analyzer
    </div>


    <div class="logout-card">


        <div class="logout-icon">
            🚪
        </div>


        <h1>
            Log out?
        </h1>


        <div class="message">
            Your expenses and budgets are saved.
            You can log in again anytime to continue
            where you left off.
        </div>


        <!-- LOGOUT -->

        <form method="POST" action="/logout">

            <button type="submit" class="logout-btn">
                Log out
            </button>

        </form>


        <!-- STAY LOGGED IN -->

        <a href="/dashboard" class="stay-btn">
            Stay logged in
        </a>


        <div class="account">
            Signed in as {{ user_email }}
        </div>


    </div>

</div>


</body>
</html>
